<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Interactive Periodic Table</title>
    <style>
        :root {
            --bg-color: #060709;
            --card-bg: rgba(15, 17, 24, 0.9);
            --transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-x: auto;
        }

        /* Top Layout Header */
        .top-bar {
            display: flex;
            width: 100%;
            max-width: 1350px;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            gap: 20px;
        }

        /* Detailed Info Card */
        .ultra-details-card {
            width: 480px;
            background-color: var(--card-bg);
            border: 2px solid var(--active-color, #ff4757);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            gap: 16px;
            box-shadow: 0 0 25px var(--active-color, #ff4757);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .card-preview-box {
            width: 105px;
            height: 110px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--active-color, #ff4757);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            flex-shrink: 0;
        }

        .card-preview-box .num { font-size: 11px; color: #fff; opacity: 0.8; }
        .card-preview-box .sym { font-size: 32px; font-weight: 800; text-align: center; color: var(--active-color, #ff4757); text-shadow: 0 0 10px currentColor; line-height: 1; }
        .card-preview-box .nm { font-size: 10px; text-align: center; color: #fff; font-weight: 600; }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 12px;
            font-size: 11px;
            color: #b0b5c0;
            width: 100%;
            align-content: center;
        }

        .details-grid div {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 2px;
        }

        .details-grid div span {
            color: #ffffff;
            font-weight: 600;
        }

        /* Filter Navigation Buttons */
        .categories-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 6px;
            max-width: 850px;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #8a8d9b;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: var(--transition);
        }

        .cat-btn:hover, .cat-btn.active {
            color: #ffffff;
            border-color: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        /* Category Colors & Glows */
        [data-category="alkali"] { --cat-color: #ff4757; }
        [data-category="alkaline"] { --cat-color: #ffa502; }
        [data-category="lanthanide"] { --cat-color: #e056fd; }
        [data-category="actinide"] { --cat-color: #ff7979; }
        [data-category="transition"] { --cat-color: #ff5252; }
        [data-category="post-transition"] { --cat-color: #70a1ff; }
        [data-category="metalloid"] { --cat-color: #00d2d3; }
        [data-category="nonmetal"] { --cat-color: #2ed573; }
        [data-category="noble"] { --cat-color: #1e90ff; }
        [data-category="unknown"] { --cat-color: #a4b0be; }

        /* Periodic Table Grid Layout */
        .table-container {
            position: relative;
            padding: 10px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, minmax(62px, 1fr));
            grid-template-rows: repeat(10, minmax(62px, 1fr));
            gap: 4px;
            width: 100%;
            max-width: 1250px;
        }

        /* Element Card */
        .element {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 3px 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            color: var(--cat-color);
            backdrop-filter: blur(4px);
        }

        .element .number { font-size: 8px; opacity: 0.75; color: #ffffff; }
        .element .symbol { font-size: 16px; font-weight: 700; text-align: center; line-height: 1; margin: 2px 0; color: var(--cat-color); text-shadow: 0 0 5px currentColor; }
        .element .name { font-size: 7.5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d1d5db; }
        .element .mass { font-size: 7px; text-align: center; color: #718093; }

        .element:hover {
            transform: scale(1.3);
            z-index: 100;
            background-color: #0c0d12;
            border-color: var(--cat-color);
            box-shadow: 0 0 15px var(--cat-color);
        }

        .element.selected {
            border: 2px solid var(--cat-color);
            box-shadow: 0 0 18px var(--cat-color);
            transform: scale(1.1);
            z-index: 90;
        }

        .element.dimmed {
            opacity: 0.12;
            filter: grayscale(85%);
        }

        .element-placeholder {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            background: transparent;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #aaa;
        }
    </style>
</head>

        placeholderAct.className = 'element-placeholder';
        placeholderAct.style.gridColumn = '3';
        placeholderAct.style.gridRow = '7';
        placeholderAct.innerHTML = '89-103';

        elementsData.forEach(el => {
            const card = document.createElement('div');
            card.className = 'element';
            card.setAttribute('data-category', el.c);
            card.style.gridColumn = el.col;
            card.style.gridRow = el.row;

            card.innerHTML = `
                <span class="number">${el.n}</span>
                <span class="symbol">${el.s}</span>
                <span class="name">${el.name}</span>
                <span class="mass">${el.m}</span>
            `;

            card.addEventListener('click', () => {
                document.querySelectorAll('.element').forEach(e => e.classList.remove('selected'));
                card.classList.add('selected');

                document.getElementById('detNum').textContent = el.n;
                document.getElementById('detSym').textContent = el.s;
                document.getElementById('detName').textContent = el.name;
                document.getElementById('detMass').textContent = `${el.m} u`;
                document.getElementById('detCat').textContent = el.c.toUpperCase();
                document.getElementById('detPhase').textContent = el.phase;
                document.getElementById('detGP').textContent = el.gp;
                document.getElementById('detEN').textContent = el.en;
                document.getElementById('detDensity').textContent = el.density;
                document.getElementById('detMelt').textContent = el.melt;
                document.getElementById('detBoil').textContent = el.boil;
                document.getElementById('detIE').textContent = el.ie;
                document.getElementById('detConfig').textContent = el.config;

                const computedColor = getComputedStyle(card).getPropertyValue('--cat-color');
                ultraCard.style.setProperty('--active-color', computedColor);
                previewBox.style.setProperty('--active-color', computedColor);
            });

            container.appendChild(card);
        });

        container.appendChild(placeholderLan);
        container.appendChild(placeholderAct);

        const buttons = document.querySelectorAll('.cat-btn');
        const elements = document.querySelectorAll('.element');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const selectedCategory = button.getAttribute('data-category');

                elements.forEach(el => {
                    const elCategory = el.getAttribute('data-category');
                    if (selectedCategory === 'all' || elCategory === selectedCategory) {
                        el.classList.remove('dimmed');
                    } else {
                        el.classList.add('dimmed');
                    }
                });
            });
        });
    </script>
</body>
</html>
